<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almacenamiento Taller</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;color:#222}
  header{background:#1f2937;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  main{padding:16px;max-width:1100px;margin:auto}
  .card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  input,select,textarea,button{font:inherit;padding:8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
  button{cursor:pointer;background:#2563eb;color:#fff;border:none}
  button.sec{background:#e5e7eb;color:#222}
  button.danger{background:#dc2626}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .toolbar input{flex:1;min-width:200px}
  table{width:100%;border-collapse:collapse;background:#fff}
  th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
  tr.bajo td{background:#fee2e2}
  .acciones button{margin:2px;padding:4px 8px;font-size:13px}
  .login{max-width:340px;margin:60px auto}
  .login form,dialog form{display:grid;gap:10px}
  dialog{border:none;border-radius:10px;padding:20px;width:min(480px,92vw)}
  .msg{color:#dc2626;font-size:14px;min-height:18px}
  .etiqueta{font-size:12px;color:#6b7280}
  @media (max-width:700px){ th:nth-child(4), td:nth-child(4){display:none} }
</style>
</head>
<body>

<section id="login" class="login card" hidden>
  <h2>Acceso</h2>
  <form id="formLogin">
    <input type="email" id="email" placeholder="Correo" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button type="submit">Entrar</button>
    <div class="msg" id="msgLogin"></div>
  </form>
</section>

<div id="app" hidden>
  <header><strong>Almacenamiento Taller</strong><button class="sec" id="btnSalir">Salir</button></header>
  <main>
    <div class="toolbar">
      <input id="buscar" placeholder="Buscar por nombre, código o ubicación...">
      <select id="filtroCat"><option value="">Todas las categorías</option></select>
      <button id="btnNuevo">+ Nuevo artículo</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>Artículo</th><th>Código</th><th>Categoría</th><th>Ubicación</th><th>Stock</th><th></th></tr></thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
    <p class="etiqueta">Filas en rojo: stock por debajo del mínimo.</p>
  </main>
</div>

<dialog id="dlgArt">
  <form id="formArt">
    <h3 id="tituloArt">Nuevo artículo</h3>
    <input name="nombre" placeholder="Nombre *" required>
    <input name="codigo" placeholder="Código">
    <input name="categoria" placeholder="Categoría" list="listaCats">
    <datalist id="listaCats"></datalist>
    <input name="ubicacion" placeholder="Ubicación (estantería, cajón...)">
    <input name="unidad" placeholder="Unidad (ud, kg, m...)" value="ud">
    <label class="etiqueta">Stock mínimo
      <input name="stock_minimo" type="number" step="any" min="0" value="0" style="width:100%">
    </label>
    <textarea name="notas" placeholder="Notas"></textarea>
    <div class="msg" id="msgArt"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="sec" data-cerrar="dlgArt">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgMov">
  <form id="formMov">
    <h3 id="tituloMov">Movimiento</h3>
    <select name="tipo">
      <option value="entrada">Entrada (añadir stock)</option>
      <option value="salida">Salida (retirar stock)</option>
    </select>
    <input name="cantidad" type="number" step="any" min="0.01" placeholder="Cantidad *" required>
    <input name="motivo" placeholder="Motivo (opcional)">
    <div class="msg" id="msgMov"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="sec" data-cerrar="dlgMov">Cancelar</button>
      <button type="submit">Registrar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgHist">
  <h3 id="tituloHist">Historial</h3>
  <div id="listaHist" style="max-height:50vh;overflow:auto"></div>
  <div style="text-align:right;margin-top:10px"><button class="sec" data-cerrar="dlgHist">Cerrar</button></div>
</dialog>

<script>
  const SUPABASE_URL = 'https://rwhxxhlwdepayzmtityx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_s2pX43RgvXgUeBxPE805Zg_i7aYz5pN';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let articulos = [];
  let artEditando = null;
  let artMov = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- Sesión ----
  sb.auth.onAuthStateChange((_evento, session) => mostrar(session));
  sb.auth.getSession().then(({data}) => mostrar(data.session));

  function mostrar(session) {
    $('login').hidden = !!session;
    $('app').hidden = !session;
    if (session) cargar();
  }

  $('formLogin').onsubmit = async e => {
    e.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email: $('email').value, password: $('password').value});
    $('msgLogin').textContent = error ? 'Correo o contraseña incorrectos' : '';
  };
  $('btnSalir').onclick = () => sb.auth.signOut();

  // ---- Datos ----
  async function cargar() {
    const {data, error} = await sb.from('articulos').select('*').order('nombre');
    if (error) return alert('Error al cargar: ' + error.message);
    articulos = data;
    const cats = [...new Set(articulos.map(a => a.categoria).filter(Boolean))].sort();
    $('filtroCat').innerHTML = '<option value="">Todas las categorías</option>' +
      cats.map(c => `<option>${esc(c)}</option>`).join('');
    $('listaCats').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
    pintar();
  }

  function pintar() {
    const q = $('buscar').value.toLowerCase();
    const cat = $('filtroCat').value;
    const lista = articulos.filter(a =>
      (!cat || a.categoria === cat) &&
      [a.nombre, a.codigo, a.ubicacion].some(v => (v || '').toLowerCase().includes(q))
    );
    $('tabla').innerHTML = lista.map(a => `
      <tr class="${a.cantidad <= a.stock_minimo ? 'bajo' : ''}">
        <td><strong>${esc(a.nombre)}</strong></td>
        <td>${esc(a.codigo)}</td>
        <td>${esc(a.categoria)}</td>
        <td>${esc(a.ubicacion)}</td>
        <td>${a.cantidad} ${esc(a.unidad)}</td>
        <td class="acciones">
          <button data-acc="mov" data-id="${a.id}">+/-</button>
          <button class="sec" data-acc="hist" data-id="${a.id}">Historial</button>
          <button class="sec" data-acc="editar" data-id="${a.id}">Editar</button>
          <button class="danger" data-acc="borrar" data-id="${a.id}">Borrar</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="6">No hay artículos.</td></tr>';
  }
  $('buscar').oninput = pintar;
  $('filtroCat').onchange = pintar;

  // ---- Artículos ----
  $('btnNuevo').onclick = () => abrirArt(null);

  function abrirArt(id) {
    artEditando = id;
    const a = articulos.find(x => x.id === id) || {};
    const f = $('formArt');
    f.reset();
    $('msgArt').textContent = '';
    $('tituloArt').textContent = id ? 'Editar artículo' : 'Nuevo artículo';
    f.nombre.value = a.nombre ?? '';
    f.codigo.value = a.codigo ?? '';
    f.categoria.value = a.categoria ?? '';
    f.ubicacion.value = a.ubicacion ?? '';
    f.unidad.value = a.unidad ?? 'ud';
    f.stock_minimo.value = a.stock_minimo ?? 0;
    f.notas.value = a.notas ?? '';
    $('dlgArt').showModal();
  }

  $('formArt').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const datos = {
      nombre: f.nombre.value.trim(),
      codigo: f.codigo.value.trim() || null,
      categoria: f.categoria.value.trim() || null,
      ubicacion: f.ubicacion.value.trim() || null,
      unidad: f.unidad.value.trim() || 'ud',
      stock_minimo: Number(f.stock_minimo.value) || 0,
      notas: f.notas.value.trim() || null
    };
    const res = artEditando
      ? await sb.from('articulos').update(datos).eq('id', artEditando)
      : await sb.from('articulos').insert({...datos, cantidad: 0});
    if (res.error) return $('msgArt').textContent = res.error.message;
    $('dlgArt').close();
    cargar();
  };

  // ---- Movimientos ----
  function abrirMov(id) {
    artMov = id;
    const a = articulos.find(x => x.id === id);
    $('tituloMov').textContent = 'Movimiento: ' + a.nombre;
    $('formMov').reset();
    $('msgMov').textContent = '';
    $('dlgMov').showModal();
  }

  $('formMov').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const {error} = await sb.from('movimientos').insert({
      articulo_id: artMov,
      tipo: f.tipo.value,
      cantidad: Number(f.cantidad.value),
      motivo: f.motivo.value.trim() || null
    });
    if (error) {
      $('msgMov').textContent = error.message.includes('Stock insuficiente')
        ? 'No hay stock suficiente para esa salida'
        : error.message;
      return;
    }
    $('dlgMov').close();
    cargar();
  };

  async function abrirHist(id) {
    const a = articulos.find(x => x.id === id);
    $('tituloHist').textContent = 'Historial: ' + a.nombre;
    const {data, error} = await sb.from('movimientos').select('*')
      .eq('articulo_id', id).order('fecha', {ascending: false}).limit(100);
    if (error) return alert(error.message);
    $('listaHist').innerHTML = data.length ? data.map(m => `
      <div style="padding:6px 0;border-bottom:1px solid #eee">
        <strong>${m.tipo === 'entrada' ? '+' : '-'}${m.cantidad} ${esc(a.unidad)}</strong>
        <span class="etiqueta">${new Date(m.fecha).toLocaleString('es-ES')}</span><br>
        <span>${esc(m.motivo) || '<i>Sin motivo</i>'}</span>
      </div>`).join('') : '<p>Sin movimientos.</p>';
    $('dlgHist').showModal();
  }

  async function borrarArt(id) {
    const a = articulos.find(x => x.id === id);
    if (!confirm(`¿Borrar "${a.nombre}" y todo su historial?`)) return;
    const {error} = await sb.from('articulos').delete().eq('id', id);
    if (error) return alert(error.message);
    cargar();
  }

  // ---- Eventos ----
  $('tabla').onclick = e => {
    const b = e.target.closest('button[data-acc]');
    if (!b) return;
    const acciones = {mov: abrirMov, hist: abrirHist, editar: abrirArt, borrar: borrarArt};
    acciones[b.dataset.acc](b.dataset.id);
  };
  document.querySelectorAll('[data-cerrar]').forEach(b =>
    b.onclick = () => $(b.dataset.cerrar).close());
</script>
</body>
</html>
